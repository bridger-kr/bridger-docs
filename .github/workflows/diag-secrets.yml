name: diag-secrets
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret shapes (no values leaked)
        env:
          REG: ${{ secrets.NCR_REGISTRY }}
          PRE: ${{ secrets.NCR_IMAGE_PREFIX }}
          USR: ${{ secrets.NCR_USERNAME }}
          PWD: ${{ secrets.NCR_PASSWORD }}
          TOK: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -u
          probe() {
            local name="$1" val="$2"
            local len=${#val}
            local first=""
            local last=""
            if [ $len -gt 0 ]; then
              first="${val:0:1}"
              last="${val: -1}"
            fi
            local has_proto=no
            case "$val" in
              http://*|https://*) has_proto=yes ;;
            esac
            local has_slash=no
            case "$val" in
              */*) has_slash=yes ;;
            esac
            local has_space=no
            case "$val" in
              *" "*) has_space=yes ;;
            esac
            local has_newline=no
            if [ "$(printf %s "$val" | wc -l)" -gt 0 ]; then has_newline=yes; fi
            echo "$name: len=$len first_class=$(echo -n "$first" | tr 'A-Za-z0-9' 'Aa9' | head -c1) last_class=$(echo -n "$last" | tr 'A-Za-z0-9' 'Aa9' | head -c1) has_proto=$has_proto has_slash=$has_slash has_space=$has_space has_newline=$has_newline"
          }
          probe NCR_REGISTRY "$REG"
          probe NCR_IMAGE_PREFIX "$PRE"
          probe NCR_USERNAME "$USR"
          probe NCR_PASSWORD "$PWD"
          probe GITOPS_TOKEN "$TOK"
          echo "--- DNS lookup of literal known host ---"
          getent hosts 9dbc4756-kr1-registry.container.nhncloud.com || echo "literal-fail"
          echo "--- DNS lookup of secret value (host part only) ---"
          host_only="${REG#https://}"; host_only="${host_only#http://}"; host_only="${host_only%%/*}"
          echo "host_only_len=${#host_only}"
          getent hosts "$host_only" >/dev/null && echo "secret-host-OK" || echo "secret-host-FAIL"
