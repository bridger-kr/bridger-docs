name: doppler-diag
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DOPPLER_KEY shape
        env:
          TOK: ${{ secrets.DOPPLER_KEY }}
        run: |
          set -eu
          len=${#TOK}
          first3="$(printf %.3s "$TOK")"
          echo "len=$len"
          echo "first3='$first3'"
          case "$TOK" in
            dp.pt.*)  echo "kind=personal-token (dp.pt.*)";;
            dp.st.*)  echo "kind=service-token (dp.st.*)";;
            dp.ct.*)  echo "kind=cli-token (dp.ct.*)";;
            dp.sa.*)  echo "kind=service-account-token (dp.sa.*)";;
            *)        echo "kind=unknown (does not match dp.pt./dp.st./dp.ct./dp.sa.)";;
          esac
      - name: Probe via API
        env:
          TOK: ${{ secrets.DOPPLER_KEY }}
        run: |
          set -eu
          status=$(curl -sS -o /tmp/r.txt -w '%{http_code}' \
            -u "${TOK}:" https://api.doppler.com/v3/me) || true
          echo "GET /v3/me -> HTTP $status"
          head -c 500 /tmp/r.txt; echo
