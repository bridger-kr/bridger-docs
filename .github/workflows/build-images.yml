name: build-images
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_USERNAME }}
          password: ${{ secrets.NCR_PASSWORD }}

      - id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.NCR_REGISTRY }}/${{ secrets.NCR_IMAGE_PREFIX }}/datari-docs:sha-${{ github.sha }}
            ${{ secrets.NCR_REGISTRY }}/${{ secrets.NCR_IMAGE_PREFIX }}/datari-docs:latest
          provenance: false
          cache-from: type=gha,scope=datari-docs
          cache-to: type=gha,mode=max,scope=datari-docs

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: happycastle114/datari-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: main

      - name: Patch deployment manifest
        env:
          REGISTRY: ${{ secrets.NCR_REGISTRY }}
          PREFIX: ${{ secrets.NCR_IMAGE_PREFIX }}
          DIGEST: ${{ steps.push.outputs.digest }}
        working-directory: gitops
        run: |
          set -euo pipefail
          target="k8s/apps/docs/deployment.yaml"
          new_image="${REGISTRY}/${PREFIX}/datari-docs@${DIGEST}"
          # Replace any prior digest pin for this exact repo path.
          sed -i -E "s|${REGISTRY}/${PREFIX}/datari-docs@sha256:[a-f0-9]+|${new_image}|g" "${target}"
          echo "--- diff ---"
          git --no-pager diff "${target}"
          if git diff --quiet "${target}"; then
            echo "No digest change. Exiting without PR."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Open PR against datari-gitops
        if: env.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          branch: bump-digest/datari-docs
          base: main
          commit-message: 'chore: update image digests from datari-docs'
          title: 'chore: bump datari-docs to ${{ steps.push.outputs.digest }}'
          body: |
            Automated digest bump from `datari-docs@${{ github.sha }}`.

            - image: `${{ secrets.NCR_REGISTRY }}/${{ secrets.NCR_IMAGE_PREFIX }}/datari-docs`
            - digest: `${{ steps.push.outputs.digest }}`
            - source commit: https://github.com/happycastle114/datari-docs/commit/${{ github.sha }}
          delete-branch: true
