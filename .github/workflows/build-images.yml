name: build-images
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NCR_REGISTRY: 9dbc4756-kr1-registry.container.nhncloud.com
  NCR_IMAGE_PREFIX: datari-prod
  IMAGE_NAME: datari-docs

jobs:
  build-and-bump:
    runs-on: datari-docs
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Doppler CLI
        run: |
          set -euo pipefail
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh
          doppler --version

      - id: doppler
        name: Fetch NCR credentials and build config via Doppler CLI
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_KEY }}
        run: |
          set -euo pipefail
          user=$(doppler secrets get NHN_USER_ACCESS_KEY --plain)
          pass=$(doppler secrets get NHN_SECRET_ACCESS_KEY --plain)
          sentry_dsn=$(doppler secrets get SENTRY_DSN --plain 2>/dev/null || true)
          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "::error::NHN_USER_ACCESS_KEY or NHN_SECRET_ACCESS_KEY missing in Doppler"
            exit 1
          fi
          echo "::add-mask::$user"
          echo "::add-mask::$pass"
          if [ -n "$sentry_dsn" ]; then
            echo "::add-mask::$sentry_dsn"
          else
            echo "::warning::SENTRY_DSN is missing; the production docs image will build without Sentry browser reporting."
          fi
          {
            echo "NCR_USERNAME=$user"
            echo "NCR_PASSWORD=$pass"
            echo "SENTRY_BUILD_DSN=$sentry_dsn"
          } >> "$GITHUB_ENV"
          echo "Doppler fetch ok (user_len=${#user} pass_len=${#pass} sentry_dsn_len=${#sentry_dsn})"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.NCR_REGISTRY }}
          username: ${{ env.NCR_USERNAME }}
          password: ${{ env.NCR_PASSWORD }}

      - id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.NCR_REGISTRY }}/${{ env.NCR_IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.NCR_REGISTRY }}/${{ env.NCR_IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:latest
          provenance: false
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            SENTRY_TRACES_SAMPLE_RATE=0.02
          secret-envs: |
            sentry_dsn=SENTRY_BUILD_DSN
          # cache disabled: self-hosted runner has local Docker layer cache;
          # type=gha requires GitHub Actions cache service which is unreliable
          # from the NHN Cloud KR1 runner network.

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: bridger-kr/bridger-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: main

      - name: Patch deployment manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        working-directory: gitops
        run: |
          set -euo pipefail
          target="k8s/apps/docs/deployment.yaml"
          new_image="${NCR_REGISTRY}/${NCR_IMAGE_PREFIX}/${IMAGE_NAME}@${DIGEST}"
          sed -i -E "s|${NCR_REGISTRY}/${NCR_IMAGE_PREFIX}/${IMAGE_NAME}@sha256:[a-f0-9]+|${new_image}|g" "${target}"
          echo "--- diff ---"
          git --no-pager diff "${target}"
          if git diff --quiet "${target}"; then
            echo "No digest change. Exiting without PR."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - id: cpr
        name: Open PR against datari-gitops
        if: env.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          branch: bump-digest/datari-docs
          base: main
          commit-message: 'chore: update image digests from datari-docs'
          title: 'chore: bump datari-docs to ${{ steps.push.outputs.digest }}'
          body: |
            Automated digest bump from `datari-docs@${{ github.sha }}`.

            - image: `datari-docs`
            - digest: `${{ steps.push.outputs.digest }}`
            - source commit: https://github.com/bridger-kr/bridger-docs/commit/${{ github.sha }}
          delete-branch: true

      - name: Merge digest-bump PR
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_TOKEN }}
          script: |
            const owner = 'bridger-kr'
            const repo = 'bridger-gitops'
            const pull_number = Number('${{ steps.cpr.outputs.pull-request-number }}')

            // Try direct squash merge first. If GitHub rejects (for example,
            // pending required checks), fall back to enabling auto-merge.
            try {
              const { data } = await github.rest.pulls.merge({
                owner, repo, pull_number, merge_method: 'squash'
              })
              console.log(`PR #${pull_number} merged directly: ${data.sha}`)
            } catch (mergeErr) {
              console.log(`Direct merge failed (${mergeErr.message}), enabling auto-merge...`)
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                      pullRequest { number }
                    }
                  }`, { id: pr.node_id })
                console.log(`Auto-merge enabled for PR #${pull_number}`)
              } catch (autoErr) {
                if (autoErr.message && autoErr.message.includes('clean status')) {
                  const { data } = await github.rest.pulls.merge({
                    owner, repo, pull_number, merge_method: 'squash'
                  })
                  console.log(`PR #${pull_number} merged on retry: ${data.sha}`)
                } else {
                  throw autoErr
                }
              }
            }
