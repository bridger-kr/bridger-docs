server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mintlify's `mint export` emits one .html file per page (e.g.
  # /getting-started/quickstart.html), not a single SPA shell. The
  # fallback chain therefore tries the literal request, then the
  # `.html` sibling, then a directory `index.html`, then a directory
  # listing — and only falls back to the root `/index.html` as a
  # last resort so unknown paths don't 404 hard.
  location / {
    try_files $uri $uri.html $uri/index.html $uri/ /index.html;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/html;
  gzip_min_length 1024;
}
