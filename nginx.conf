server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mintlify's `mint export` emits one directory per page with an
  # `index.html` inside (e.g. /getting-started/quickstart/index.html).
  # Page slugs in `docs.json` mirror the on-disk path relative to the
  # repo root, so the URL `/getting-started/quickstart` must resolve to
  # `/getting-started/quickstart/index.html`. The fallback chain tries
  # literal file → `.html` sibling → directory index → root index as a
  # last resort so unknown paths render the home page instead of 404.
  location / {
    try_files $uri $uri.html $uri/index.html $uri/ /index.html;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/html;
  gzip_min_length 1024;
}
